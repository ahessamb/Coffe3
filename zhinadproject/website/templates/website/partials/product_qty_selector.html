<div class="quantity-form product-qty-form" role="group" aria-label="تعداد">
    <button type="button" class="qty-btn" data-qty-action="decrease" aria-label="کاهش تعداد" title="کاهش">−</button>
    <input type="number" name="quantity" min="1" max="{{ max_stock }}" value="1" class="qty-input" aria-label="تعداد" readonly>
    <button type="button" class="qty-btn" data-qty-action="increase" aria-label="افزایش تعداد" title="افزایش">+</button>
</div>
